<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Hillium</title>
    <link rel="stylesheet" href="/_/vendor/zen/zen.css" />
    <link rel="stylesheet" href="/_/chrome.css" />
    <link rel="stylesheet" href="/_/themes/zen.css" data-look="zen" disabled />
    <link rel="stylesheet" href="/_/themes/glass.css" data-look="glass" disabled />
    <link rel="stylesheet" href="/_/themes/retro.css" data-look="retro" disabled />
    <script type="module" src="/_/chrome.js"></script>
  </head>
  <body data-look="arc">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4v5h-5" /></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3" /><path d="M9.5 4.5v15" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.3-4.3" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9" rx="2" /><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3" /></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9" rx="2" /><path d="M8.5 11V8a3.5 3.5 0 0 1 6.6-1.6" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6.5l5.5 5.5-5.5 5.5" /></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" /><path d="M16 9.5l5 5M21 9.5l-5 5" /></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.2" /><path d="M5 9v9.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14" /></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L13 11M10 19.5H4.5V14M4.5 19.5L11 13" /></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" /><path d="M12 4.5v15" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17M12 3.5c2.6 2.6 3.6 5.5 3.6 8.5s-1 5.9-3.6 8.5c-2.6-2.6-3.6-5.5-3.6-8.5s1-5.9 3.6-8.5z" /></symbol>
      <symbol id="i-boost" viewBox="0 0 24 24"><path d="M12 3.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z" /></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7.5 3V12c0 4.5-3.2 7.5-7.5 8.5-4.3-1-7.5-4-7.5-8.5V6.5z" /></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" /><circle cx="12" cy="12" r="1.3" /><circle cx="18" cy="12" r="1.3" /></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4.5h6l-1 5 3 3H7l3-3zM12 12.5v7" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="10.5" height="10.5" rx="2" /><path d="M5.5 15V6.5a2 2 0 0 1 2-2H15" /></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
      <symbol id="i-max" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24"><path d="M12 5v10M7.5 10.5L12 15l4.5-4.5M6 19.5h12" /></symbol>
    </svg>

    <div id="backdrop" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

    <header id="retro-title" aria-hidden="true">
      <span class="retro-app"><span class="retro-logo"></span><span id="retro-caption">Hillium</span></span>
      <span class="retro-buttons">
        <button data-window="minimize" tabindex="-1">_</button><button data-window="maximize" tabindex="-1">□</button><button data-window="close" tabindex="-1">×</button>
      </span>
    </header>

    <aside id="sidebar" aria-label="Sidebar">
      <div class="top drag">
        <div class="window-controls no-drag">
          <button class="wc close" data-window="close" title="Close"><svg><use href="#i-x" /></svg></button>
          <button class="wc min" data-window="minimize" title="Minimize"><svg><use href="#i-min" /></svg></button>
          <button class="wc max" data-window="maximize" title="Maximize"><svg><use href="#i-max" /></svg></button>
        </div>
        <span class="grow"></span>
        <button class="icon-btn no-drag" id="btn-sidebar" title="Toggle sidebar (⌘S)"><svg><use href="#i-sidebar" /></svg></button>
        <button class="icon-btn no-drag" id="btn-back" title="Back"><svg><use href="#i-back" /></svg></button>
        <button class="icon-btn no-drag" id="btn-forward" title="Forward"><svg><use href="#i-forward" /></svg></button>
        <button class="icon-btn no-drag" id="btn-reload" title="Reload"><svg><use href="#i-reload" /></svg></button>
      </div>

      <div id="url" class="no-drag">
        <button id="url-site" title="Site settings"><svg><use href="#i-search" /></svg></button>
        <button id="url-text">Search or enter address</button>
        <button id="url-copy" class="icon-btn" title="Copy address (⇧⌘C)"><svg><use href="#i-copy" /></svg></button>
      </div>

      <div id="favourites" class="no-drag" aria-label="Favourites"></div>

      <div id="space-pages" class="no-drag">
        <section id="space" aria-label="Space">
          <div class="zen-current-workspace-indicator space-head">
            <span class="zen-current-workspace-indicator-icon" id="space-icon"></span>
            <span id="space-name"></span>
            <span class="grow"></span>
            <button class="icon-btn small" id="space-menu" title="Edit space"><svg><use href="#i-dots" /></svg></button>
          </div>
          <div id="pinned" class="list"></div>
          <div class="divider">
            <span class="line"></span>
            <button id="clear-today" title="Archive these tabs"><svg><use href="#i-clear" /></svg>Clear</button>
          </div>
          <button id="new-tab" class="row"><svg><use href="#i-plus" /></svg><span>New Tab</span></button>
          <div id="today" class="list"></div>
        </section>
      </div>

      <footer class="no-drag">
        <button class="icon-btn" id="btn-library" title="Library (⌘Y)"><svg><use href="#i-library" /></svg></button>
        <button class="icon-btn" id="btn-downloads" title="Downloads" hidden><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /></svg><svg><use href="#i-download" /></svg></button>
        <span class="grow"></span>
        <nav id="space-dots" aria-label="Spaces"></nav>
        <span class="grow"></span>
        <button class="icon-btn" id="btn-new-space" title="New space"><svg><use href="#i-plus" /></svg></button>
      </footer>
      <div id="toast" role="status" aria-live="polite"></div>
    </aside>
    <div id="resizer" class="no-drag" title="Drag to resize"></div>
    <div id="edge" aria-hidden="true"></div>

    <main id="card">
      <div id="strip">
        <form id="findbar" hidden>
          <svg><use href="#i-search" /></svg>
          <input id="find-input" placeholder="Find in page" spellcheck="false" />
          <span id="find-count"></span>
          <button type="button" class="icon-btn small" id="find-prev" title="Previous"><svg><use href="#i-back" /></svg></button>
          <button type="button" class="icon-btn small" id="find-next" title="Next"><svg><use href="#i-forward" /></svg></button>
          <button type="button" class="icon-btn small" id="find-close" title="Close"><svg><use href="#i-x" /></svg></button>
        </form>
        <div id="permission" hidden>
          <span id="permission-text"></span>
          <label><input type="checkbox" id="permission-remember" checked /> Remember</label>
          <button id="permission-block">Block</button>
          <button id="permission-allow" class="primary">Allow</button>
        </div>
      </div>
      <div id="page">
        <div id="empty">
          <div class="clock" id="clock"></div>
          <button id="empty-search"><svg><use href="#i-search" /></svg><span>Search or enter address</span><kbd>⌘T</kbd></button>
          <p class="hint" id="empty-hint"></p>
        </div>
        <div id="snapshots"></div>
      </div>
    </main>

    <div id="dropzones" hidden>
      <div class="zen-split-view-dropzone" data-side="left"><span>Split left</span></div>
      <div class="zen-split-view-dropzone" data-side="right"><span>Split right</span></div>
    </div>
    <div id="splitters"></div>

    <div id="scrim" hidden></div>

    <div id="command" role="dialog" aria-label="Command bar" hidden>
      <div class="retro-dialog-title">Run</div>
      <div class="command-input">
        <svg><use href="#i-search" /></svg>
        <input id="command-input" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
        <kbd id="command-mode"></kbd>
      </div>
      <ul id="results" role="listbox"></ul>
    </div>

    <div id="glance-buttons" class="zen-glance-sidebar-container" hidden>
      <button id="glance-close" title="Close (Esc)"><svg><use href="#i-x" /></svg></button>
      <button id="glance-expand" title="Open as tab"><svg><use href="#i-expand" /></svg></button>
      <button id="glance-split" title="Open in split view"><svg><use href="#i-split" /></svg></button>
    </div>

    <div id="popover" class="panel" hidden></div>
  </body>
</html>

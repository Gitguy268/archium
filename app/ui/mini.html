<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Little Archium</title>
    <link rel="stylesheet" href="/_/mini.css" />
    <script type="module" src="/_/mini.js"></script>
  </head>
  <body>
    <header class="bar">
      <span class="lights"></span>
      <button id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
      <form id="address"><input id="url" spellcheck="false" placeholder="Search or enter address" /></form>
      <button id="copy" title="Copy address"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="10.5" height="10.5" rx="2" /><path d="M5.5 15V6.5a2 2 0 0 1 2-2H15" /></svg></button>
      <button id="move" class="primary" title="Open in Archium">Open in Archium</button>
      <button id="close" class="linux-only" title="Close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
    </header>
  </body>
</html>

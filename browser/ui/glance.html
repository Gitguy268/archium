<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glance</title>
  <link rel="stylesheet" href="themes/base.css">
  <link rel="stylesheet" href="glance.css">
</head>
<body data-theme="normal">
  <div class="frame">
    <header id="head" class="head">
      <button id="back" class="icon" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <form id="form" class="field" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <input id="address" spellcheck="false" placeholder="Glance: search or address" aria-label="Search or address">
      </form>
      <button id="pin" class="icon" aria-label="Pin Glance" aria-pressed="false" title="Pin (stay open)"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg></button>
      <button id="open" class="icon" aria-label="Open in a tab" title="Open in a tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button id="hide" class="icon" aria-label="Hide Glance" title="Hide (Esc)"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </header>
    <div id="empty" class="empty">
      <p class="big">Glance</p>
      <p>A quick look at the web without leaving what you're doing.</p>
      <p class="keys"><kbd>⌃</kbd><kbd>⌥</kbd><kbd>Space</kbd> shows or hides it from any app.</p>
    </div>
  </div>
  <script type="module" src="glance.js"></script>
</body>
</html>

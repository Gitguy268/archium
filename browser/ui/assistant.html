<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assistant</title>
  <link rel="stylesheet" href="themes/base.css">
  <link rel="stylesheet" href="assistant.css">
</head>
<body data-theme="normal">
  <section class="panel" aria-label="Assistant">
    <header class="head">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7L8 20v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></svg>
      <div class="head-text"><h1>Assistant</h1><p id="model-line">MiniCPM-V 4.7 1B · on this Mac</p></div>
      <button id="close" class="icon" aria-label="Close assistant"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </header>

    <div id="setup" class="setup" hidden>
      <p><strong>MiniCPM-V 4.7 1B</strong> runs on this Mac and can read the page you're on. What you ask stays here.</p>
      <p id="setup-size" class="muted">One download of 1.57 GB from Hugging Face, checked piece by piece.</p>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="progress-text" class="muted" aria-live="polite"></p>
      <button id="download" class="primary">Download model</button>
    </div>

    <ol id="log" class="log" aria-live="polite"></ol>

    <div class="actions">
      <button data-action="summarize">Summarize page</button>
      <button data-action="look">Describe page</button>
    </div>
    <form id="ask" class="ask">
      <label class="use-page"><input type="checkbox" id="use-page" checked> Use this page</label>
      <div class="ask-row">
        <textarea id="input" rows="2" placeholder="Ask about this page…" aria-label="Message"></textarea>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
    </form>
  </section>
  <script type="module" src="assistant.js"></script>
</body>
</html>

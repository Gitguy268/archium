name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, lint, shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Electron's own download isn't needed for the unit tests.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: shellcheck ../packaging/arch/*.sh test/arch/*.sh start.command

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-builder --linux tar.gz --x64 --publish never
      - name: The tarball has the app, the CLI and the icons
        run: tar -tzf dist/archium-*-x64.tar.gz | grep -E 'archium$|resources/cli/archium.mjs|resources/icons/512x512.png' | wc -l | grep -qx 3

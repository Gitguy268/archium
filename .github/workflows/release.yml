name: Release

# Builds the macOS app (for the Homebrew cask) and the Flatpak. Pull requests build both as a
# check; a v* tag also attaches them to the GitHub Release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [app/**, packaging/**, branding/**, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
      - name: Zip Archium.app
        run: |
          version=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent dist/mac-arm64/Archium.app "dist/Archium-$version-macos-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: app/dist/Archium-*-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Linux tarball (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-builder --linux tar.gz --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tarball
          path: app/dist/archium-*-x64.tar.gz
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-tarball
          path: tarball
      - run: mv tarball/archium-*-x64.tar.gz packaging/flatpak/archium-linux-x64.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.gitguy268.archium.yml
          bundle: io.github.gitguy268.archium.flatpak
          artifact-name: flatpak
          cache: false
      - name: Validate the metainfo
        run: appstreamcli validate --no-net --explain packaging/flatpak/io.github.gitguy268.archium.metainfo.xml
      - name: Install the bundle and check that it starts
        run: |
          flatpak install --user -y --noninteractive --bundle io.github.gitguy268.archium.flatpak
          flatpak info --user io.github.gitguy268.archium
          set +e
          timeout 25 xvfb-run -a flatpak run --user io.github.gitguy268.archium --no-sandbox > run.log 2>&1
          code=$?
          set -e
          tail -20 run.log
          # 124 means it was still running when the timeout stopped it.
          test "$code" = 124

  release:
    name: Attach to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          (cd out && sha256sum Archium-*.zip io.github.gitguy268.archium.flatpak > SHA256SUMS)
          files="out/Archium-*.zip out/io.github.gitguy268.archium.flatpak out/SHA256SUMS"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files -R "$GITHUB_REPOSITORY" --verify-tag --title "Archium ${TAG#v}" \
              --notes "macOS: \`brew trust gitguy268/tap && brew install --cask gitguy268/tap/archium\`. Linux: download the .flatpak and run \`flatpak install --user ./io.github.gitguy268.archium.flatpak\`. See CHANGELOG.md."
          fi
